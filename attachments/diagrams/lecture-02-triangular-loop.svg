<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 350" width="520" height="350" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="520" height="350" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f2937">Inner loop runs for j = i … n-1   (n = 4)</text>
<text x="138.0" y="60" font-size="14" text-anchor="middle" fill="#1f2937">j=0</text>
<text x="194.0" y="60" font-size="14" text-anchor="middle" fill="#1f2937">j=1</text>
<text x="250.0" y="60" font-size="14" text-anchor="middle" fill="#1f2937">j=2</text>
<text x="306.0" y="60" font-size="14" text-anchor="middle" fill="#1f2937">j=3</text>
<text x="98" y="103.0" font-size="14" text-anchor="end" fill="#1f2937">i=0</text>
<rect x="110" y="70" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="138.0" y="104.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="166" y="70" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="194.0" y="104.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="222" y="70" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="104.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="278" y="70" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="306.0" y="104.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<text x="350" y="103.0" font-size="14" fill="#1f2937">4 runs</text>
<text x="98" y="159.0" font-size="14" text-anchor="end" fill="#1f2937">i=1</text>
<rect x="110" y="126" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="166" y="126" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="194.0" y="160.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="222" y="126" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="160.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="278" y="126" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="306.0" y="160.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<text x="350" y="159.0" font-size="14" fill="#1f2937">3 runs</text>
<text x="98" y="215.0" font-size="14" text-anchor="end" fill="#1f2937">i=2</text>
<rect x="110" y="182" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="166" y="182" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="222" y="182" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="250.0" y="216.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<rect x="278" y="182" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="306.0" y="216.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<text x="350" y="215.0" font-size="14" fill="#1f2937">2 runs</text>
<text x="98" y="271.0" font-size="14" text-anchor="end" fill="#1f2937">i=3</text>
<rect x="110" y="238" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="166" y="238" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="222" y="238" width="56" height="56" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1" stroke-dasharray="4 3"/>
<rect x="278" y="238" width="56" height="56" fill="#bfdbfe" stroke="#2563eb" stroke-width="2"/>
<text x="306.0" y="272.0" font-size="16" text-anchor="middle" fill="#1e3a8a">run</text>
<text x="350" y="271.0" font-size="14" fill="#1f2937">1 run</text>
<text x="20" y="328" font-size="15" fill="#1f2937">4 + 3 + 2 + 1 = 10 = n(n+1)/2   →   O(n²)</text>
