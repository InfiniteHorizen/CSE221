<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 190" width="940" height="190" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<rect width="940" height="190" fill="#ffffff"/>
<text x="20" y="26" font-size="16" font-weight="bold" fill="#1f2937">Growth order (slowest to fastest)</text>
<rect x="20" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="75" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(1)</text>
<text x="75" y="124" font-size="13" text-anchor="middle" fill="#1f2937">constant</text>
<text x="75" y="144" font-size="11" text-anchor="middle" fill="#6b7280">no loop</text>
<text x="140" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="150" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="205" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(log n)</text>
<text x="205" y="124" font-size="13" text-anchor="middle" fill="#1f2937">logarithmic</text>
<text x="205" y="144" font-size="11" text-anchor="middle" fill="#6b7280">i*=2, i/=2</text>
<text x="270" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="280" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="335" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(√n)</text>
<text x="335" y="124" font-size="13" text-anchor="middle" fill="#1f2937">square root</text>
<text x="335" y="144" font-size="11" text-anchor="middle" fill="#6b7280">i*i&lt;=n</text>
<text x="400" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="410" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="465" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(n)</text>
<text x="465" y="124" font-size="13" text-anchor="middle" fill="#1f2937">linear</text>
<text x="465" y="144" font-size="11" text-anchor="middle" fill="#6b7280">i++, i--</text>
<text x="530" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="540" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="595" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(n log n)</text>
<text x="595" y="124" font-size="13" text-anchor="middle" fill="#1f2937">linearithmic</text>
<text x="595" y="144" font-size="11" text-anchor="middle" fill="#6b7280">n × log n loops</text>
<text x="660" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="670" y="46" width="110" height="56" rx="8" fill="#e0f2fe" stroke="#0284c7" stroke-width="2"/>
<text x="725" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(n²)</text>
<text x="725" y="124" font-size="13" text-anchor="middle" fill="#1f2937">quadratic</text>
<text x="725" y="144" font-size="11" text-anchor="middle" fill="#6b7280">nested n × n</text>
<text x="790" y="82" font-size="20" text-anchor="middle" fill="#6b7280">&lt;</text>
<rect x="800" y="46" width="110" height="56" rx="8" fill="#fed7aa" stroke="#ea580c" stroke-width="2"/>
<text x="855" y="82" font-size="16" font-weight="bold" text-anchor="middle" fill="#1f2937">O(2ⁿ)</text>
<text x="855" y="124" font-size="13" text-anchor="middle" fill="#1f2937">exponential</text>
<text x="855" y="144" font-size="11" text-anchor="middle" fill="#6b7280">2ⁿ, 4ⁿ</text>
<text x="20" y="176" font-size="12" fill="#6b7280">A variable in the exponent over a constant base (2ⁿ, 4ⁿ) beats every polynomial term.</text>
</svg>